name: Build and Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version to tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Install Playwright Chromium (Windows)
        run: npm run electron:vendor:win

      - name: Build UI
        run: npm run ui:build

      - name: Build Electron main bundle
        run: npm run electron:main:build

      - name: Build macro bundle
        run: npm run electron:macro:build

      - name: Build & publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set release title
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          gh release edit "${{ github.ref_name }}" --title "Windows SRT ${{ github.ref_name }}" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version to tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Install Playwright Chromium (Windows)
        run: npm run electron:vendor:win

      - name: Build UI
        run: npm run ui:build

      - name: Build Electron main bundle
        run: npm run electron:main:build

      - name: Build macro bundle
        run: npm run electron:macro:build

      - name: Build & publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dedupe release and set title
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # electron-builder's concurrent asset uploads can race and create two
          # releases for the same tag. Keep the one with the most assets (the
          # real installer), delete the rest, then set its title.
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          IDS=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id")

          KEEP=""
          KEEP_COUNT=-1
          for id in $IDS; do
            COUNT=$(gh api "repos/$REPO/releases/$id/assets" --jq 'length')
            if [ "$COUNT" -gt "$KEEP_COUNT" ]; then
              KEEP_COUNT="$COUNT"
              KEEP="$id"
            fi
          done

          for id in $IDS; do
            if [ "$id" != "$KEEP" ]; then
              echo "Deleting duplicate release $id (tag $TAG)"
              gh api -X DELETE "repos/$REPO/releases/$id"
            fi
          done

          gh api -X PATCH "repos/$REPO/releases/$KEEP" -f name="Windows SRT $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
